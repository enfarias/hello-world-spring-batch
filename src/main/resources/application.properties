spring.application.name=hello-world-spring-batch

# Conexao com o MySQL do Docker
spring.datasource.url=jdbc:mysql://localhost:3307/spring_batch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234567}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Inicializacao das tabelas internas do Spring Batch no MySQL
spring.batch.jdbc.initialize-schema=always

# Define o caminho e nome do arquivo de log
logging.file.name=logs/spring-batch.log

# Opcional: Define o limite de tamanho do arquivo antes de criar um novo
logging.logback.rollingpolicy.max-file-size=10MB
